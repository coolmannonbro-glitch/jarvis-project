<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - Custom Terminal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #050b14;
            color: #00f0ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .panel {
            border: 2px solid #00f0ff;
            padding: 30px;
            border-radius: 15px;
            background: rgba(0, 240, 255, 0.02);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.15), inset 0 0 20px rgba(0, 240, 255, 0.05);
            text-align: center;
            max-width: 550px;
            width: 95%;
        }
        .widgets {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.85rem;
            color: #8ab4f8;
            border-bottom: 1px dashed rgba(0, 240, 255, 0.3);
            padding-bottom: 10px;
        }
        .arc-reactor {
            width: 70px;
            height: 70px;
            border: 4px dashed #00f0ff;
            border-radius: 50%;
            margin: 15px auto;
            animation: rotate 6s linear infinite;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
        }
        h1 {
            font-size: 1.8rem;
            letter-spacing: 4px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px #00f0ff;
        }
        .status {
            color: #00ff66;
            font-size: 0.85rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .console {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            height: 150px;
            overflow-y: auto;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: #8ab4f8;
        }
        .console-line { margin-bottom: 5px; }
        .console-jarvis { color: #00f0ff; font-weight: bold; }
        .input-box {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            background: rgba(5, 11, 20, 0.8);
            border: 1px solid #00f0ff;
            border-radius: 5px;
            padding: 10px;
            color: #00f0ff;
            font-family: inherit;
            outline: none;
        }
        input[type="text"]:focus {
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
        .btn {
            background: transparent;
            color: #00f0ff;
            border: 1px solid #00f0ff;
            padding: 10px 20px;
            font-family: inherit;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #00f0ff;
            color: #050b14;
            box-shadow: 0 0 12px #00f0ff;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="panel">
        <div class="widgets">
            <div id="widget-date">DATE: --/--/----</div>
            <div id="widget-time">TIME: --:--:--</div>
        </div>

        <div class="arc-reactor"></div>
        <h1>JARVIS CORE</h1>
        <div class="status">// SYSTEM STATUS: SECURE</div>

        <div class="console" id="console-output">
            <div class="console-line"><span class="console-jarvis">Джарвіс:</span> Автономні протоколи активовані, сер. Системи захищені та працюють без хмарних збоїв. Введіть <span style="color: #fff">help</span> для списку можливостей.</div>
        </div>

        <div class="input-box">
            <input type="text" id="user-command" placeholder="Введіть команду або питання..." autofocus>
            <button class="btn" onclick="sendCommand()">Дія</button>
        </div>
    </div>

    <script>
        function updateDateTime() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            document.getElementById('widget-date').innerText = `DATE: ${day}/${month}/${now.getFullYear()}`;
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('widget-time').innerText = `TIME: ${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        const inputField = document.getElementById('user-command');
        inputField.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendCommand(); });

        function printToConsole(sender, text, isJarvis = false) {
            const consoleOutput = document.getElementById('console-output');
            const line = document.createElement('div');
            line.className = 'console-line';
            line.innerHTML = isJarvis ? `<span class="console-jarvis">${sender}:</span> ${text}` : `<span>${sender}:</span> ${text}`;
            consoleOutput.appendChild(line);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }

        function sendCommand() {
            const cmd = inputField.value.trim().toLowerCase();
            if (!cmd) return;

            printToConsole('Ви', inputField.value, false);
            inputField.value = '';

            setTimeout(() => {
                // База знань Джарвіса
                if (cmd === 'help' || cmd === 'допомога') {
                    printToConsole('Джарвіс', 'Доступні запити: статус, привіт, хто твій творець, анекдот, ютуб, гугл, очистити.', true);
                } else if (cmd === 'статус' || cmd === 'status') {
                    printToConsole('Джарвіс', 'Усі системи стабільні. Процесор: 24%. Температура реактора: 42°C. Захист: Максимальний.', true);
                } else if (cmd === 'clear' || cmd === 'очистити') {
                    document.getElementById('console-output').innerHTML = '';
                } else if (cmd === 'привіт' || cmd === 'hello' || cmd === 'хай') {
                    printToConsole('Джарвіс', 'З поверненням, сер! Чим можу допомогти сьогодні?', true);
                } else if (cmd === 'хто твій творець' || cmd === 'хто тебе створив') {
                    printToConsole('Джарвіс', 'Я був розроблений найкращим інженером Stark Industries (тобто вами, сер!).', true);
                } else if (cmd === 'анекдот' || cmd === 'розкажи анекдот') {
                    const jokes = [
                        "Чому роботам ніколи не буває самотньо? Бо у них всередині багато платформ для спілкування!",
                        "Скільки програмістів потрібно, щоб закрутити лампочку? Жодного, це апаратна проблема.",
                        "Заходить робот у бар і каже: 'Мені щось для розгону'. Бармен наливає йому моторне мастило."
                    ];
                    const randomJoke = jokes[Math.floor(Math.random() * jokes.length)];
                    printToConsole('Джарвіс', randomJoke, true);
                } else if (cmd === 'youtube' || cmd === 'ютуб') {
                    printToConsole('Джарвіс', 'Відкриваю YouTube у новій вкладці...', true);
                    window.open('https://youtube.com', '_blank');
                } else if (cmd === 'google' || cmd === 'гугл') {
                    printToConsole('Джарвіс', 'Запускаю Google...', true);
                    window.open('https://google.com', '_blank');
                } else {
                    printToConsole('Джарвіс', 'Запит оброблено локально. Я не знайшов готового сценарію для цієї фрази. Спробуйте запитати щось інше або напишіть "help".', true);
                }
            }, 300);
        }
    </script>
</body>
</html>
