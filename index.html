<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - AI Quantum Terminal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #050b14;
            color: #00f0ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .panel {
            border: 2px solid #00f0ff;
            padding: 30px;
            border-radius: 15px;
            background: rgba(0, 240, 255, 0.02);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.15), inset 0 0 20px rgba(0, 240, 255, 0.05);
            text-align: center;
            max-width: 600px;
            width: 95%;
        }
        .widgets {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.85rem;
            color: #8ab4f8;
            border-bottom: 1px dashed rgba(0, 240, 255, 0.3);
            padding-bottom: 10px;
        }
        .arc-reactor {
            width: 70px;
            height: 70px;
            border: 4px dashed #00f0ff;
            border-radius: 50%;
            margin: 15px auto;
            animation: rotate 6s linear infinite;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
        }
        h1 {
            font-size: 1.8rem;
            letter-spacing: 4px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px #00f0ff;
        }
        .status {
            color: #00ff66;
            font-size: 0.85rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .console {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            height: 200px;
            overflow-y: auto;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: #8ab4f8;
            line-height: 1.4;
        }
        .console-line { margin-bottom: 8px; }
        .console-jarvis { color: #00f0ff; font-weight: bold; }
        .input-box {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            background: rgba(5, 11, 20, 0.8);
            border: 1px solid #00f0ff;
            border-radius: 5px;
            padding: 12px;
            color: #00f0ff;
            font-family: inherit;
            outline: none;
        }
        input[type="text"]:focus {
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
        .btn {
            background: transparent;
            color: #00f0ff;
            border: 1px solid #00f0ff;
            padding: 10px 20px;
            font-family: inherit;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #00f0ff;
            color: #050b14;
            box-shadow: 0 0 12px #00f0ff;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="panel">
        <div class="widgets">
            <div id="widget-date">DATE: --/--/----</div>
            <div id="widget-time">TIME: --:--:--</div>
        </div>

        <div class="arc-reactor"></div>
        <h1>JARVIS AI V-2.0</h1>
        <div class="status" id="system-status">// QUANTUM CORE: ONLINE</div>

        <div class="console" id="console-output">
            <div class="console-line"><span class="console-jarvis">Джарвіс:</span> Штучний інтелект підключено, сер. Я готовий до будь-яких запитань!</div>
        </div>

        <div class="input-box">
            <input type="text" id="user-command" placeholder="Запитайте щось у Джарвіса..." autofocus>
            <button class="btn" onclick="sendCommand()">Дія</button>
        </div>
    </div>

    <script>
        // ВСТАВ СВІЙ API КЛЮЧ СЮДИ В ДУЖКИ:
        const GEMINI_API_KEY = "AQ.Ab8RN6Jesi7Gn5Vc2qC83DZ57M98PtDx-SjaEIaoTtWpvyZtGA";

        function updateDateTime() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            document.getElementById('widget-date').innerText = `DATE: ${day}/${month}/${now.getFullYear()}`;
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('widget-time').innerText = `TIME: ${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        const inputField = document.getElementById('user-command');
        inputField.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendCommand(); });

        function printToConsole(sender, text, isJarvis = false) {
            const consoleOutput = document.getElementById('console-output');
            const line = document.createElement('div');
            line.className = 'console-line';
            line.innerHTML = isJarvis ? `<span class="console-jarvis">${sender}:</span> ${text}` : `<span>${sender}:</span> ${text}`;
            consoleOutput.appendChild(line);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }

        async function askGeminiAI(userText) {
            const statusLabel = document.getElementById('system-status');
            statusLabel.innerText = "// JARVIS IS THINKING...";
            statusLabel.style.color = "#ffaa00";

            try {
                // Додаємо інструкцію для ШІ, щоб він поводився як Джарвіс
                const systemPrompt = "Ти — Джарвіс, суперінтелект та особистий асистент Тоні Старка. Відповідай українською мовою, коротко, впевнено і ввічливо, використовуючи звертання 'сер'. Твоя відповідь:";
                
                const response = await fetch(`https://googleapis.com{GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: systemPrompt + " " + userText }] }]
                    })
                });

                const data = await response.json();
                const aiResponse = data.candidates[0].content.parts[0].text;
                printToConsole('Джарвіс', aiResponse, true);
            } catch (error) {
                printToConsole('Джарвіс', 'Помилка доступу до нейромережі. Перевірте API ключ у коді.', true);
                console.error(error);
            }

            statusLabel.innerText = "// QUANTUM CORE: ONLINE";
            statusLabel.style.color = "#00ff66";
        }

        function sendCommand() {
            const cmd = inputField.value.trim();
            if (!cmd) return;

            printToConsole('Ви', cmd, false);
            inputField.value = '';

            const lowCmd = cmd.toLowerCase();

            // Звичайні швидкі команди
            if (lowCmd === 'help') {
                printToConsole('Джарвіс', 'Доступні локальні команди: clear, youtube, google. Або просто пишіть мені будь-які питання як ШІ!', true);
            } else if (lowCmd === 'clear') {
                document.getElementById('console-output').innerHTML = '';
            } else if (lowCmd === 'youtube' || lowCmd === 'ютуб') {
                printToConsole('Джарвіс', 'Відкриваю YouTube, сер...', true);
                window.open('https://youtube.com', '_blank');
            } else if (lowCmd === 'google' || lowCmd === 'гугл') {
                printToConsole('Джарвіс', 'Запускаю Google...', true);
                window.open('https://google.com', '_blank');
            } 
            // Якщо це не команда — надсилаємо в ШІ Gemini!
            else {
                askGeminiAI(cmd);
            }
        }
    </script>
</body>
</html>
